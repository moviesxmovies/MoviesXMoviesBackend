[pytest]
DJANGO_SETTINGS_MODULE = main.settings
python_files = tests.py test_*.py *_tests.py
filterwarnings =
    # Ignore deprecations related to USERNAME_REQUIRED and EMAIL_REQUIRED in app_settings
    ignore:app_settings.USERNAME_REQUIRED is deprecated:UserWarning
    ignore:app_settings.EMAIL_REQUIRED is deprecated:UserWarning

    # Ignore factory_boy about autosave
    ignore:.*_after_postgeneration will stop saving the instance:DeprecationWarning