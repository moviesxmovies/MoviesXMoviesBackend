<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1f1f1f;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #f2f2f2;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #1f1f1f;
        }

        .header-container {
            padding: 40px 0 20px 0;
            text-align: center;
            width: 100%;
        }

        .header-logo-img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(47, 39, 206, 0.3);
        }

        .brand-name {
            color: #bb3dff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 15px;
            display: block;
            text-transform: uppercase;
        }

        .content-card {
            background-color: #f2f2f2;
            margin: 0 20px 40px 20px;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(187, 61, 255, 0.15);
        }

        h1 {
            color: #1f1f1f;
            font-size: 24px;
            margin-bottom: 15px;
            margin-top: 0;
        }

        p {
            color: #1f1f1f;
            font-size: 16px;
            line-height: 1.6;
        }

        .code-container {
            background-color: #1f1f1f;
            border: 2px solid #2f27ce;
            border-radius: 8px;
            padding: 25px;
            margin: 30px 0;
        }

        .verification-code {
            color: #bb3dff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 12px;
            margin: 0;
            padding-left: 12px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #bcbbdd;
            font-size: 12px;
        }

        .btn {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #2f27ce 0%, #bb3dff 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-container">
            <img src="https://moviesxmovies.jonaykb.com/web-app-manifest-192x192.png" alt="Logo"
                class="header-logo-img">
            <span class="brand-name">Movies<span style="color: #2f27ce;">X</span>Movies</span>
        </div>

        <div class="content-card">
            <h1>¡Hola, {% if user.first_name %}{{ user.first_name|capfirst }}{% else %}{{ user.username }}{% endif %}!
            </h1>
            {% block content %}{% endblock %}

            <a href="https://moviesxmovies.jonaykb.com" class="btn">Abrir MoviesXMovies</a>
        </div>

        <div class="footer">
            {% block footer_text %}{% endblock %}
            <p>&copy; {% now "Y" %} MoviesXMovies Team. Cine para todos.</p>
        </div>
    </div>
</body>

</html>
