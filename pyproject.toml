[project]
name = "moviesxmoviesbackend"
version = "1.16.5"
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.10.1",
    "cryptography>=46.0.4",
    "dj-rest-auth>=5.0.2",
    "django>=6.0.1",
    "django-allauth==0.55.0",
    "django-cors-headers>=4.9.0",
    "django-prometheus>=2.4.0",
    "django-redis>=6.0.0",
    "django-rq>=3.2.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "gunicorn>=25.1.0",
    "implicit>=0.7.2",
    "pillow>=12.1.0",
    "prettyconf>=2.3.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.11.0",
    "requests>=2.32.5",
    "rq-scheduler>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.11.1",
    "pytest-cov>=7.0.0",
    "pytest-rich>=0.2.0",
    "factory-boy>=3.3.3",
    "pytest-factoryboy>=2.8.1",
    "mypy>=1.19.1",
]

