[project]
name = "moviesxmoviesbackend"
version = "0.13.2"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.4",
    "dj-rest-auth>=5.0.2",
    "django>=6.0.1",
    "django-allauth>=65.14.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "pillow>=12.1.0",
    "prettyconf>=2.3.0",
    "psycopg2-binary>=2.9.11",
    "pyjwt>=2.11.0",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.11.1",
    "pytest-cov>=7.0.0",
    "pytest-rich>=0.2.0",
    "factory-boy>=3.3.3",
    "pytest-factoryboy>=2.8.1",

]
