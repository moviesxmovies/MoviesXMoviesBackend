[project]
name = "moviesxmoviesbackend"
version = "0.8.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "pillow>=12.1.0",
    "prettyconf>=2.3.0",
    "psycopg2-binary>=2.9.11",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.11.1",
    "pytest-cov>=7.0.0",
    "pytest-rich>=0.2.0",
]
